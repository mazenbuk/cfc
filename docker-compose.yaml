services:
  # ---------- DATA WAREHOUSE ----------
  postgres:
    image: postgres:16
    container_name: chelsea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chelsea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chelsea_admin}
      POSTGRES_DB: ${POSTGRES_DB:-chelsea_dw}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./etl/db_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chelsea_admin} -d ${POSTGRES_DB:-chelsea_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chelsea_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-chelsea@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-chelsea_admin}
    ports:
      - "5050:80"

  # ---------- AIRFLOW ----------
  airflow-postgres:
    image: postgres:16
    container_name: chelsea_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    container_name: chelsea_airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas psycopg2-binary requests python-dotenv"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chelsea_dw}
      POSTGRES_USER: ${POSTGRES_USER:-chelsea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chelsea_admin}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - >-
          airflow db upgrade &&
          airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@chelsea.local

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: chelsea_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: chelsea_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  pg_data:
    driver: local
  airflow_pg_data:
    driver: local
  airflow_logs:
    driver: local